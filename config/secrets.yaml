# 🔐 Secrets Configuration - DO NOT commit this file with real secrets!
# Use environment variables or secret management service in production

# Database Secrets
database:
  postgres:
    password: "your-super-secret-postgres-password"
  
  redis:
    password: "your-redis-password"
  
  mongodb:
    password: "your-mongodb-password"

# Provider Secrets
providers:
  smtp:
    user: "your-email@gmail.com"
    pass: "your-app-specific-password"
  
  sendgrid:
    api_key: "SG.your-sendgrid-api-key"
  
  aws:
    access_key: "AKIAYOURAWSACCESSKEY"
    secret_key: "your-aws-secret-key"

# Security Secrets
security:
  encryption_key: "32-byte-ultra-secure-encryption-key-here"
  jwt_secret: "your-jwt-signing-secret-key"
  api_keys:
    - name: "production-key-1"
      key: "vs_live_1234567890abcdef"
      permissions: ["read", "write"]
    - name: "staging-key-1"
      key: "vs_test_1234567890abcdef"
      permissions: ["read", "write"]

# Monitoring
monitoring:
  sentry_dsn: "https://your-sentry-key@sentry.io/project-id"
  slack_webhook: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX"
  pagerduty_key: "your-pagerduty-routing-key"

# External Services
services:
  redis:
    password: "redis-password"
  
  elasticsearch:
    password: "elastic-password"