  release:
    name: Create Release
    needs: [build, docker]  # পরিবর্তন: deploy-production না থাকলে build ও docker-এর উপর নির্ভর করবে
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Generate release notes (simple)
      run: |
        echo "Release ${{ github.ref_name }}" > RELEASE_NOTES.md
        echo "Changes:" >> RELEASE_NOTES.md
        git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: RELEASE_NOTES.md
        files: |
          voidsend-*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install k6
      run: |
        curl -s https://github.com/grafana/k6/releases/download/v0.44.1/k6-v0.44.1-linux-amd64.tar.gz | tar xz
        sudo mv k6-v0.44.1-linux-amd64/k6 /usr/local/bin/

    - name: Run performance tests (basic)
      run: |
        go run main.go &
        sleep 5
        echo "Running basic load test..."
        k6 run <(echo '
          import http from "k6/http";
          import { check, sleep } from "k6";
          export default function () {
            let res = http.post("http://localhost:8080/v2/ultra-dispatch", JSON.stringify({
              user_id: "test",
              action: "welcome",
              data: { name: "Performance" }
            }), { headers: { "Content-Type": "application/json", "X-API-Key": "test" } });
            check(res, { "status is 202": (r) => r.status === 202 });
            sleep(1);
          }
        ') --vus 10 --duration 10s
        pkill main