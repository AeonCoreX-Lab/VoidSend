version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: voidsend-postgres
    environment:
      POSTGRES_USER: voidsend
      POSTGRES_PASSWORD: voidsend
      POSTGRES_DB: voidsend
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voidsend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidsend"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voidsend-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-voidsend}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voidsend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB ঐচ্ছিক (comment out করে রাখতে পারেন যদি না লাগে)
  # mongodb:
  #   image: mongo:6-jammy
  #   container_name: voidsend-mongodb
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-voidsend}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-voidsend}
  #     MONGO_INITDB_DATABASE: voidsend
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #   networks:
  #     - voidsend-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  voidsend-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voidsend-engine
    image: voidsend:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # mongodb:
      #   condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - DATABASE_URL=postgresql://voidsend:voidsend@postgres:5432/voidsend?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-voidsend}@redis:6379/0
      # - MONGODB_URL=mongodb://${MONGO_USER:-voidsend}:${MONGO_PASSWORD:-voidsend}@mongodb:27017
      - GIN_MODE=release
      - TZ=Asia/Dhaka
    volumes:
      - ./config:/app/config
      - ./templates:/app/templates
      - ./logs:/app/logs
    networks:
      - voidsend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # আলাদা worker সার্ভিসের দরকার নেই (engine নিজেই worker চালায়)
  # voidsend-worker:
  #   image: voidsend:latest
  #   container_name: voidsend-worker
  #   command: ["./voidsend", "worker"]
  #   depends_on:
  #     voidsend-engine:
  #       condition: service_healthy
  #   environment:
  #     - DATABASE_URL=postgresql://voidsend:voidsend@postgres:5432/voidsend?sslmode=disable
  #     - REDIS_URL=redis://:${REDIS_PASSWORD:-voidsend}@redis:6379/0
  #     - WORKER_ID=${WORKER_ID:-1}
  #   volumes:
  #     - ./config:/app/config
  #   networks:
  #     - voidsend-network
  #   restart: unless-stopped
  #   deploy:
  #     replicas: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: voidsend-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - voidsend-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: voidsend-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    networks:
      - voidsend-network
    restart: unless-stopped
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: voidsend-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - voidsend-network
    restart: unless-stopped
    depends_on:
      - voidsend-engine

networks:
  voidsend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  # mongodb_data:
  prometheus_data:
  grafana_data: